name: Release

# Builds the MergeMark installers for Windows and macOS whenever a version tag
# is pushed, then attaches them to a draft GitHub Release for review.
#
# Usage:
#   git tag v1.0.0 master
#   git push origin v1.0.0
#
# Updates: the build signs its updater artifacts with the key whose public
# half is in tauri.conf.json (key ID 51088306F548AC07, new in 1.0; secrets
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) and
# attaches latest.json. 0.9.1 and 0.9.2 trust an earlier key whose password
# was lost, so they cannot install an update; the release text tells them so. Installed copies read
# /releases/latest/download/latest.json, which is served only for the newest
# PUBLISHED, non-prerelease release: the draft reaches them when you publish it.
#
# PDFium: Windows ships the committed `src-tauri/pdfium.dll` beside the
# executable (`tauri.windows.conf.json`). macOS fetches the same PDFium build,
# as a universal library checked against its SHA-256
# (`scripts/fetch-pdfium-macos.sh`), into the app's Contents/Frameworks
# (`tauri.macos.conf.json`); the tests find it in src-tauri. macOS is one
# universal build, Apple Silicon and Intel, first run on a Mac on 10 Oct 2026
# (docs/MACOS_TEST.md). Linux is not built: nothing bundles PDFium for it.
#
# Neither installer carries a publisher's signature. Windows SmartScreen warns
# on first run; the macOS app is signed ad hoc and not notarised, so
# Gatekeeper blocks its first opening until the user allows it (Privacy &
# Security -> Open Anyway, in the README). To sign them, add the signing
# secrets documented at https://v2.tauri.app/distribute/ and pass them to the
# tauri-action step.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the draft release

jobs:
  build-installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rustTargets: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rustTargets: "aarch64-apple-darwin,x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # PDFium is committed for Windows only (see the top of this file).
      - name: Fetch PDFium (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/fetch-pdfium-macos.sh

      # The Rust crate embeds the built frontend, so it is built before the
      # tests compile.
      - name: Build the frontend
        run: npm run build

      # The tests read real exam papers. They are not in git (copyright); an
      # encrypted copy of the ones the tests read is (src-tauri/fixtures/corpus).
      - name: Restore the test papers
        env:
          MERGEMARK_FIXTURES_KEY: ${{ secrets.MERGEMARK_FIXTURES_KEY }}
        run: node scripts/fixtures.mjs unpack

      # A test whose paper is missing fails rather than passing unchecked.
      # bash runs with -eo pipefail, so either command failing fails the step
      # (PowerShell, the Windows default, would report only the last one).
      - name: Test
        shell: bash
        env:
          MERGEMARK_REQUIRE_FIXTURES: "1"
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          node --test "scripts/tests/*.test.mjs" "scripts/*.test.mjs" "src/lib/*.test.mjs"

      - name: Build app and upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MergeMark ${{ github.ref_name }}"
          # Installed copies show this text in their update prompt, 0.9.1 and
          # 0.9.2 included: they trust a key that can no longer sign.
          releaseBody: |
            Using a 0.9 beta? It cannot install this update by itself. Download MergeMark from https://github.com/badma025/MergeMark/releases and install it over the beta: your library is kept.

            Download the installer for your computer below. From 1.0 on, MergeMark updates itself when a newer release is published.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
