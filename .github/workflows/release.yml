name: Release

# Builds the MergeMark Windows installer whenever a version tag is pushed,
# then attaches it to a draft GitHub Release for review.
#
# Usage:
#   git tag v0.9.4 master
#   git push origin v0.9.4
#
# Windows only, on purpose. MergeMark loads PDFium through
# `Pdfium::bind_to_system_library()` and ships `pdfium.dll` beside the
# executable via `src-tauri/tauri.windows.conf.json`. There is no equivalent
# bundling for macOS or Linux yet, so those builds compile but fail at the
# first import with "Failed to bind to pdfium". macOS also needs a Developer
# ID signature and notarisation before Gatekeeper will open it at all.
# Re-add those platforms once both are solved; see docs/ROUND2_HANDOFF.md.
#
# The installer is unsigned, so Windows SmartScreen warns on first run. To
# sign it, add the signing secrets documented at
# https://v2.tauri.app/distribute/ and pass them to the tauri-action step.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the draft release

jobs:
  build-installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rustTargets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # The Rust crate embeds the built frontend, so it is built before the
      # tests compile.
      - name: Build the frontend
        run: npm run build

      # The tests read real exam papers. They are not in git (copyright); an
      # encrypted copy of the ones the tests read is (src-tauri/fixtures/corpus).
      - name: Restore the test papers
        env:
          MERGEMARK_FIXTURES_KEY: ${{ secrets.MERGEMARK_FIXTURES_KEY }}
        run: node scripts/fixtures.mjs unpack

      # A test whose paper is missing fails rather than passing unchecked.
      # bash runs with -eo pipefail, so either command failing fails the step
      # (PowerShell, the Windows default, would report only the last one).
      - name: Test
        shell: bash
        env:
          MERGEMARK_REQUIRE_FIXTURES: "1"
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          node --test "scripts/tests/*.test.mjs" "scripts/*.test.mjs" "src/lib/*.test.mjs"

      - name: Build app and upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MergeMark ${{ github.ref_name }}"
          releaseBody: "Download the installer below. See docs/BETA_TESTERS.md before your first import."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
