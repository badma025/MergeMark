[package]
name = "mergemark"
version = "1.0.0"
description = "MergeMark — Maths past-paper to topic bank (V1)"
authors = ["MergeMark Contributors"]
edition = "2021"
default-run = "mergemark"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mergemark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# Serialization — already used by Tauri IPC
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database — SQLite via sqlx, sharing Tauri's tokio runtime
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }

# Async runtime (shared with Tauri's internal runtime)
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
uuid = { version = "1.23.5", features = ["v4"] }
regex = "1.13.0"
pdf-extract = "0.7"
image = "0.25.10"
base64 = "0.22.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
csv = "1.4.0"
pdfium-render = "0.9.3"
rayon = "1.10"

# A card records the SHA-256 of the PDF it came from, to know the file again
# if it moves. Already in Cargo.lock through Tauri.
sha2 = "0.10"

# Local OCR for scanned pages on macOS: Apple's Vision framework. Both
# crates, and objc2-core-foundation behind NSRect, are already in Cargo.lock
# through Tauri; only the Foundation classes the Vision calls use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSGeometry", "NSObject", "NSRange", "NSString", "objc2-core-foundation"] }

# Local OCR for scanned pages on Windows: the operating system's own engine
# (Windows.Media.Ocr). Already in the dependency graph through Tauri.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections", "Globalization", "Win32_System_WinRT"] }

# Updates: the app checks the project's GitHub releases for a newer signed
# build (the only request it makes; imports never leave the machine), and
# restarts into it. v0.9.1 and v0.9.2 shipped the same updater and key.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
